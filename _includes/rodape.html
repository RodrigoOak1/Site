<!-- Rodapé comum a todas as páginas. Os links vêm do _config.yml. -->
<footer class="rodape">
  <p>© {{ 'now' | date: "%Y" }} {{ site.autor }}</p>
  <p class="rodape-links">
    {% if site.github_url != blank %}<a href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
    {% if site.itch_url != blank %}<a href="{{ site.itch_url }}" target="_blank" rel="noopener">itch.io</a>{% endif %}
    {% if site.email != blank %}<a href="mailto:{{ site.email }}">Email</a>{% endif %}
  </p>
</footer>
